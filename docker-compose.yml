version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: lms_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./html:/usr/share/nginx/html:ro
    networks:
      - lmsnet

networks:
  lmsnet:
    driver: bridge
